[package]
name = "embed"
version = "0.1.0"
edition = "2021"

[features]
serde = ["dep:serde"]

[dependencies]
scraper = "0.23"
serde = { version = "1.0", optional = true, features = ["derive"] }

url = "2"
percent-encoding = "2"

tracing = "0.1"

# https://github.com/servo/rust-url/issues/993
# Pin old version of idna to remove ~50 deps...
idna_adapter = "=1.1.0"
